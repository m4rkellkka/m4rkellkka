name: profile

on:
  schedule:
    # GitHub delays or drops runs scheduled at :00, so use an odd minute plus an evening backup
    - cron: "17 3 * * *" # 06:17 Istanbul
    - cron: "17 15 * * *" # 18:17 Istanbul
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build_profile.py
      - scripts/profile/**
      - requirements.txt
      - .github/workflows/profile.yml

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/build_profile.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: lets pushes to private repos show up as "latest push" (see fetch_live)
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
      - name: Commit if the rendered profile changed
        run: |
          if [ -z "$(git status --porcelain assets/profile)" ]; then
            echo "Profile is up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile
          git commit -m "chore(profile): refresh live data"
          git push

  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#c4572e&color_dots=#ebedf0,#f5d6c8,#eaa88a,#d9764f,#b8532d
            dist/snake-dark.svg?palette=github-dark&color_snake=#e0794d&color_dots=#161b22,#3d2218,#6e3620,#a8502c,#e0794d
      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
