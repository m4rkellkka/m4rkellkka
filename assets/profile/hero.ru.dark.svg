<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img">
<title>Михаил Савушкин. Делаю приложения, которыми команды клиники пользуются вместо тредов в WhatsApp.</title>
<style>text{text-rendering:geometricPrecision;white-space:pre}@font-face{font-family:pf-body;src:url(data:font/woff2;base64,) format('woff2')}.pf-body{font-family:pf-body}@font-face{font-family:pf-serif;src:url(data:font/woff2;base64,) format('woff2')}.pf-serif{font-family:pf-serif}@font-face{font-family:pf-serif-it;src:url(data:font/woff2;base64,) format('woff2')}.pf-serif-it{font-family:pf-serif-it}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}.scribble{stroke-dasharray:1;stroke-dashoffset:0;animation:draw .9s cubic-bezier(.65,0,.35,1) .5s both}@media (prefers-reduced-motion:reduce){.scribble{animation:none}}</style>
<defs></defs>
<rect x="0.5" y="0.5" width="1199" height="469" rx="20" fill="#1b1715" stroke="rgba(240,233,222,0.16)"/>
<text x="64" y="78" class="pf-serif" font-size="24" fill="#ece7df">Михаил Савушкин</text>
<text x="1136" y="78" class="pf-body" font-size="16" fill="#b7b0a8" text-anchor="end">Стамбул</text>
<text x="64" y="168" class="pf-serif" font-size="50"><tspan fill="#ece7df">Делаю</tspan><tspan fill="#ece7df"> приложения,</tspan><tspan fill="#ece7df"> которыми</tspan></text>
<text x="64" y="228" class="pf-serif" font-size="50"><tspan fill="#ece7df">команды</tspan><tspan fill="#ece7df"> клиники</tspan><tspan fill="#ece7df"> пользуются</tspan></text>
<text x="64" y="288" class="pf-serif" font-size="50"><tspan fill="#ea865e" class="pf-serif-it">вместо</tspan><tspan fill="#ece7df"> тредов</tspan><tspan fill="#ece7df"> в</tspan><tspan fill="#ece7df"> WhatsApp.</tspan></text>
<path d="M62 301C94.66 298 123.69 303.6 156.35 300.6S214.42 298.4 243.45 301.2" pathLength="1" fill="none" stroke="#ea865e" stroke-width="2.6" stroke-linecap="round" class="scribble"/>
<text x="64" y="350" class="pf-body" font-size="19" fill="#cbc7bf">Data Scientist в Яндексе в 2022–23, потом продажи в клинике, теперь её full-stack разработчик.</text>
<path d="M64 390H1136" stroke="rgba(240,233,222,0.16)"/>
<text x="64" y="432" class="pf-body" font-size="15" fill="#b7b0a8">Открыт к full-stack и AI-ролям</text>
<circle cx="867.41" cy="427" r="3.5" fill="#ea865e"/>
<text x="1136" y="432" class="pf-body" font-size="15" text-anchor="end"><tspan fill="#b7b0a8">последний пуш → </tspan><tspan fill="#ece7df">amber.</tspan><tspan fill="#b7b0a8"> · 18.11.2026</tspan></text>
</svg>
